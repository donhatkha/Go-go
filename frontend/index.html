<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-go User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Go-go User Management</h1>
            <p class="subtitle">Full-stack Go application with PostgreSQL</p>
            <div id="health-status" class="health-status">
                <span class="status-indicator"></span>
                <span class="status-text">Checking server status...</span>
            </div>
        </header>

        <main>
            <!-- Add User Form -->
            <section class="card">
                <h2>Add New User</h2>
                <form id="user-form">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter user name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="Enter user email">
                    </div>
                    <button type="submit" class="btn btn-primary">Add User</button>
                </form>
            </section>

            <!-- Users List -->
            <section class="card">
                <div class="section-header">
                    <h2>Users List</h2>
                    <button id="refresh-btn" class="btn btn-secondary">🔄 Refresh</button>
                </div>
                <div id="users-container">
                    <p class="loading">Loading users...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Built with Go, PostgreSQL, and vanilla JavaScript</p>
        </footer>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit User</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-name">Name:</label>
                    <input type="text" id="edit-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="edit-email">Email:</label>
                    <input type="email" id="edit-email" name="email" required>
                </div>
                <button type="submit" class="btn btn-primary">Update User</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
